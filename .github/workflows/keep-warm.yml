# Keeps ask-wj and the BI Copilot demo awake during the hours visitors are likely around (08:00-22:59 MYT), from a
# public repo so the Actions minutes are free. Render sleeps a free service after 15 idle minutes and suspends
# ALL free services once 750 instance-hours/month are used - so this pings deliberately few services, for
# deliberately few hours (~450 h/month each), instead of an always-on monitor. Outside these hours the first
# visitor pays a 30-60 s cold start; nothing is ever suspended.
name: keep-warm

on:
  schedule:
    - cron: "*/10 0-14 * * *" # every 10 min, 00:00-14:59 UTC = 08:00-22:59 MYT
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping health endpoints
        run: |
          for url in \
            https://ask-wj.onrender.com/healthz \
            https://bicopilot.onrender.com/healthz; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 120 --retry 2 --retry-delay 15 "$url" || echo 000)
            echo "$url -> $code"
          done
